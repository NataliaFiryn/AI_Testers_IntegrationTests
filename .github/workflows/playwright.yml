name: Playwright Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      HUSKY: 0
      BASE_URL: ${{ vars.BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          DEMO_USER_CLIENT_USERNAME: ${{ secrets.DEMO_USER_CLIENT_USERNAME }}
          DEMO_USER_CLIENT_PASSWORD: ${{ secrets.DEMO_USER_CLIENT_PASSWORD }}
        run: npm test -- --forbid-only

      - name: Upload Playwright report and test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 30
